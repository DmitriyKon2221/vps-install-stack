<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Service status</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f7fb; color: #1e293b; }
    main { width: min(440px, calc(100% - 48px)); padding: 36px; border-radius: 20px; background: white; box-shadow: 0 24px 70px #1e293b14; }
    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: #22a06b; }
    p { color: #64748b; }
  </style>
</head>
<body><main><h1>Service status</h1><p><span class="dot"></span>Online</p></main></body>
</html>
